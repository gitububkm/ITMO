# Настройки анализа SonarQube (используются pysonar в CI-джобе `sast`)
sonar.projectKey=devsecops-news-api
sonar.projectName=devsecops-news-api

sonar.sources=backend/app,backend/alembic,backend/Dockerfile,frontend/src,frontend/Dockerfile,docker-compose.yaml
sonar.tests=backend/tests
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8

# Джоба падает, если не пройден Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
