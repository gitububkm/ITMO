[project]
name = "shortener-api-backend"
version = "0.1.0"
description = "URL shortener API with analytics, cache and background workers (FastAPI)."
readme = "README.md"
requires-python = ">=3.13,<3.14"

authors = [
    { name = "artembardysev" }
]

dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn[standard]>=0.53.0,<0.54.0",
    "gunicorn>=26.2.0,<26.3.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "alembic>=1.20.0,<1.21.0",
    "pydantic[email]>=2.13.5,<2.14.0",
    "pydantic-settings>=2.15.0,<2.16.0",
    "psycopg2-binary>=2.9.13,<2.10.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pyjwt>=2.14.0,<2.15.0",
    "python-multipart>=0.0.32,<0.1.0",
    "redis[hiredis]>=5.3.1,<6.0.0",
    "celery[redis]>=5.6.3,<5.7.0",
    "structlog>=26.1.0,<27.0.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "fakeredis>=2.38.0,<3.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "ruff>=0.16.8,<0.17.0",
    "mypy>=2.3.1,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.4.3,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D203",
    "D205",
    "D213",
    "CPY001",
    "ERA001",
    "RUF002",
    "RUF003",
    "INP001",
    "S101",
    "S105",
    "N806",
    "ANN401",
    "B008",
    "FAST001",
    "FAST002",
    "PLR0913",
    "PLR2004",
    "PLC0415",
    "ARG001",
    "PT022",
    "COM812",
    "TC001",
    "TC002",
    "TC003",
]
