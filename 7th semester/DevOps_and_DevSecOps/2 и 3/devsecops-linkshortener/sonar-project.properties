# SonarQube analysis settings (used by pysonar in the `sast` CI job)
sonar.projectKey=devsecops-linkshortener
sonar.projectName=devsecops-linkshortener

sonar.sources=backend/app,backend/alembic,backend/Dockerfile,docker-compose.yaml
sonar.tests=backend/tests
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8

# Fail the scanner (and the CI job) when the quality gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
